<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#00d26a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Praktikum">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://api.github.com https://gist.githubusercontent.com; manifest-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none';">
<title>Praktikum Tracker</title>
<style>
:root{
  --accent:#00d26a;--accent2:#4dff9a;--accent-rgb:0,210,106;
  --glow:rgba(0,210,106,.16);--glow-strong:rgba(0,210,106,.28);
  --btn-text:#000000;--radius:20px;--radius-sm:14px;--radius-pill:999px;
  --s0:#6b7280;--s1:#60a5fa;--s2:#2dd4bf;--s3:#fbbf24;--s4:#34d399;--s5:#f87171;
  --danger:#ff4757;
}
[data-theme="dark"]{
  --bg:#000000;--bg-card:#121212;--bg-hover:#1a1a1a;--bg-el:#1e1e1e;
  --border:rgba(255,255,255,.09);--border-s:rgba(255,255,255,.05);
  --text:#ffffff;--dim:rgba(255,255,255,.62);--faint:rgba(255,255,255,.38);
  --overlay:rgba(0,0,0,.82);--hero-grad:linear-gradient(135deg,rgba(var(--accent-rgb),.22) 0%,rgba(var(--accent-rgb),.04) 55%,transparent 100%);
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#f2f2f7;--bg-card:#ffffff;--bg-hover:#f8f8fc;--bg-el:#eef0f5;
  --border:rgba(0,0,0,.08);--border-s:rgba(0,0,0,.05);
  --text:#111111;--dim:rgba(0,0,0,.55);--faint:rgba(0,0,0,.38);
  --overlay:rgba(0,0,0,.45);--hero-grad:linear-gradient(135deg,rgba(var(--accent-rgb),.14) 0%,rgba(var(--accent-rgb),.03) 55%,transparent 100%);
  --shadow:0 8px 28px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,var(--glow),transparent 70%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}

/* ONBOARDING */
#onboarding{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(12px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.ob-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--shadow);}
.ob-head{padding:24px 24px 0;}
.ob-head h1{font-size:22px;font-weight:700;margin-bottom:4px;}
.ob-head p{color:var(--dim);font-size:13px;}
.ob-steps{display:flex;gap:5px;padding:14px 24px 0;}
.ob-step{height:3px;border-radius:99px;flex:1;background:var(--border);transition:background .3s;}
.ob-step.done{background:var(--accent);}
.ob-body{padding:20px 24px 24px;}
.ob-body h2{font-size:15px;font-weight:650;margin-bottom:14px;}
.lang-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.lang-opt{border:1px solid var(--border);background:var(--bg-el);border-radius:var(--radius-sm);
  padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;}
.lang-opt:hover{border-color:var(--accent);}
.lang-opt.sel{background:var(--glow);border-color:var(--accent);color:var(--accent);}
.lang-opt .flag{font-size:24px;display:block;margin-bottom:5px;}
.lang-opt .lname{font-size:12px;font-weight:600;}
.ob-instr{background:var(--bg-el);border:1px solid var(--border-s);border-radius:10px;
  padding:14px;margin-bottom:12px;font-size:13px;line-height:1.8;color:var(--dim);}
.ob-instr b{color:var(--text);}
.ob-instr a{color:var(--accent2);text-decoration:none;}
.ob-instr ol{padding-left:18px;}
.ob-field{display:flex;gap:8px;margin-bottom:6px;}
.ob-field input{flex:1;background:var(--bg-el);border:1px solid var(--border);
  color:var(--text);font-size:13px;padding:10px 12px;border-radius:9px;outline:none;font-family:monospace;}
.ob-field input:focus{border-color:var(--accent);}
.ob-err{font-size:11px;color:var(--danger);min-height:16px;margin-bottom:4px;}
.ob-info{font-size:12px;color:var(--s4);min-height:16px;margin-bottom:4px;}
.ob-skip{font-size:12px;color:var(--faint);text-align:center;margin:8px 0 0;cursor:pointer;}
.ob-skip:hover{color:var(--dim);}
.ob-opt-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;
  background:var(--glow);color:var(--accent);border-radius:5px;padding:2px 7px;margin-left:8px;}
.ob-success{background:var(--glow);border:1px solid var(--glow-strong);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:12px;font-size:13px;color:var(--accent);}
.ob-success b{display:block;margin-bottom:4px;font-size:14px;}
.ob-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.btn-back{background:transparent;border:1px solid var(--border);color:var(--dim);
  font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer;}
.btn-back:hover{color:var(--text);}
.btn-next{background:var(--accent);border:none;color:var(--btn-text);font-weight:700;
  font-size:13px;padding:10px 22px;border-radius:var(--radius-pill);cursor:pointer;}
.btn-next:hover{filter:brightness(1.08);transform:translateY(-1px);}

/* MAIN APP */
.app{max-width:960px;margin:0 auto;padding:22px 16px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.brand-mark{width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  box-shadow:0 4px 16px var(--glow);position:relative;}
.brand-mark::after{content:"";position:absolute;inset:10px;border-radius:4px;background:var(--bg);opacity:.85;}
.brand-text h1{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
.dot{color:var(--accent);}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--s0);transition:background .3s;}
.sync-dot.ok{background:var(--s4);}
.sync-dot.spin{background:var(--s3);animation:pulse 1s infinite;}
.sync-dot.err{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.subtitle{font-size:11px;color:var(--dim);}
.topbar-right{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.btn-ghost{background:var(--bg-el);border:1px solid var(--border);color:var(--dim);
  font-size:12px;padding:8px 12px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;transition:all .15s;}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);background:var(--glow);}
.btn-ghost.al{background:var(--glow);border-color:var(--accent);color:var(--accent);}
.btn-add{background:var(--accent);color:var(--btn-text);border:none;font-weight:700;
  font-size:13px;padding:10px 16px;border-radius:var(--radius-pill);cursor:pointer;box-shadow:0 4px 16px var(--glow);}
.btn-add:hover{filter:brightness(1.08);transform:translateY(-1px);}

/* info bars */
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--radius-sm);margin-bottom:10px;flex-wrap:wrap;}
.bar[hidden]{display:none;}
.bar-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--s0);}
.bar-dot.ok{background:var(--s4);}
.bar-dot.spin{background:var(--s3);animation:pulse 1s infinite;}
.bar-dot.err{background:var(--danger);}
.bar-text{font-size:12px;color:var(--dim);flex:1;}
.bar-text b{color:var(--text);}
.bar-text.err{color:var(--danger);}
.bar-btn{font-size:11px;padding:5px 9px;}

/* hero / progress */
.hero-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);
  background-image:var(--hero-grad);position:relative;overflow:hidden;}
.hero-card::after{content:"";position:absolute;top:-40%;right:-10%;width:180px;height:180px;
  background:radial-gradient(circle,var(--glow) 0%,transparent 70%);pointer-events:none;}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;position:relative;z-index:1;}
.hero-label{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;}
.hero-pct{font-size:13px;font-weight:700;color:var(--accent);}
.hero-stat{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px;position:relative;z-index:1;}
.hero-stat span{font-size:15px;font-weight:500;color:var(--dim);}
.prog-wrap{margin-bottom:0;position:relative;z-index:1;}
.prog-cap{display:none;}
.prog-track{display:flex;height:8px;border-radius:var(--radius-pill);overflow:hidden;background:var(--bg-el);border:1px solid var(--border-s);}
.prog-seg{height:100%;transition:width .35s ease;border-radius:var(--radius-pill);}

/* filters */
.frow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-bottom:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.frow::-webkit-scrollbar{display:none;}
.chip{border:1px solid var(--border);background:var(--bg-card);color:var(--dim);
  font-size:12px;padding:7px 14px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.chip:hover{border-color:var(--accent);color:var(--text);}
.chip.active{background:var(--glow);border-color:var(--accent);color:var(--accent);font-weight:600;}
.chip.pA.active{background:rgba(245,185,78,.18);border-color:var(--s3);color:var(--s3);}
.chip.pB.active{background:rgba(108,147,255,.18);border-color:var(--s1);color:var(--s1);}
.chip.pC.active{border-color:var(--dim);color:var(--dim);}
.chip.pN.active{border-color:var(--faint);color:var(--faint);}
.chip.pX.active{background:rgba(241,102,110,.12);border-color:var(--danger);color:var(--danger);}
.search-inp{flex:1;min-width:120px;background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);outline:none;}
.search-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);}
.search-row{display:flex;gap:6px;margin-bottom:12px;}

/* cards */
.list{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--bg-card);border:1px solid var(--border-s);border-left:3px solid var(--c,var(--s0));
  border-radius:var(--radius);overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card:hover{background:var(--bg-hover);transform:translateY(-1px);box-shadow:var(--shadow);}
.card-main{display:flex;align-items:center;gap:8px;padding:14px 16px;flex-wrap:wrap;}
.card-info{flex:1;min-width:0;}
.card-info h3{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.slbl{font-size:11px;font-weight:700;color:var(--c,var(--s0));}
.dlbl{font-size:11px;color:var(--faint);}
.ptag{font-size:10px;font-weight:600;color:var(--accent);background:var(--glow);padding:2px 7px;border-radius:var(--radius-pill);}
.pbadge{display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:5px;font-size:10px;font-weight:800;flex:none;}
.pbadge.A{background:rgba(245,185,78,.18);color:var(--s3);}
.pbadge.B{background:rgba(108,147,255,.18);color:var(--s1);}
.pbadge.C{background:rgba(255,255,255,.06);color:var(--faint);}
.npos{font-size:10px;color:var(--danger);background:rgba(241,102,110,.1);
  border:1px solid rgba(241,102,110,.2);border-radius:4px;padding:1px 5px;margin-left:3px;}

/* Deadline & date badges */
.dl-badge{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap;}
.dl-urgent{color:#fff;background:var(--danger);}
.dl-soon{color:#140c24;background:var(--s3);}
.dl-far{color:var(--dim);background:var(--bg-el);border:1px solid var(--border);}
.dl-passed{color:var(--danger);text-decoration:line-through;font-size:10px;}
.open-badge{font-size:10px;color:var(--s2);background:rgba(52,201,192,.1);
  border:1px solid rgba(52,201,192,.2);border-radius:5px;padding:2px 6px;white-space:nowrap;}
.sent-ago{font-size:11px;color:var(--faint);}
.sent-ago.followup{color:var(--s3);font-weight:600;}
.ai-date-badge{font-size:10px;color:var(--s3);background:rgba(245,185,78,.1);
  border:1px solid rgba(245,185,78,.25);border-radius:4px;padding:1px 5px;}

/* Sort row */
.sort-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.sort-row span{font-size:11px;color:var(--faint);flex-shrink:0;}
.sort-chip{border:1px solid var(--border);background:var(--bg-card);color:var(--dim);
  font-size:11px;padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;transition:all .15s;}
.sort-chip:hover{border-color:var(--accent);}
.sort-chip.active{background:var(--glow);border-color:var(--accent);color:var(--accent);font-weight:600;}
select.ssel{background:var(--bg-el);border:1px solid var(--border);color:var(--text);
  font-size:12px;padding:6px 7px;border-radius:7px;outline:none;cursor:pointer;max-width:120px;flex-shrink:0;}
.ibtn{background:transparent;border:1px solid var(--border);color:var(--dim);
  font-size:12px;padding:6px 8px;border-radius:7px;cursor:pointer;flex-shrink:0;}
.ibtn:hover{color:var(--text);border-color:var(--accent);}
.ibtn.del:hover{color:var(--danger);border-color:var(--danger);}

/* detail */
.detail{border-top:1px solid var(--border-s);padding:16px;background:var(--bg-hover);}
.det-links a{color:var(--accent);text-decoration:none;font-size:12px;
  border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius-pill);background:var(--bg-el);}
.det-links a:hover{border-color:var(--accent);background:var(--glow);}
.det-links .muted{color:var(--faint);font-size:12px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:8px;}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;}
.field input,.field textarea,.field select{width:100%;background:var(--bg-el);border:1px solid var(--border);
  color:var(--text);font-size:13px;padding:8px 9px;border-radius:7px;outline:none;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:50px;}
.det-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
.ai-row{display:flex;align-items:center;gap:8px;margin:10px 0 3px;}
.btn-ai{background:var(--glow);border:1px solid var(--accent);color:var(--accent);
  font-size:12px;font-weight:600;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;}
.btn-ai:hover{background:var(--accent);color:var(--btn-text);}
.btn-ai:disabled{opacity:.4;cursor:default;}
.ai-st{font-size:12px;min-height:14px;margin:5px 0;}
.ai-st.loading{color:var(--dim);}
.ai-st.ok{color:var(--s4);}
.ai-st.err{color:var(--danger);}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow-y:auto;}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;padding:22px;box-shadow:var(--shadow);}
.modal h2{font-size:17px;font-weight:700;margin-bottom:14px;}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.btn-prim{background:var(--accent);border:none;color:var(--btn-text);font-weight:700;font-size:13px;padding:10px 20px;border-radius:var(--radius-pill);cursor:pointer;}
.btn-sec{background:var(--bg-el);border:1px solid var(--border);color:var(--dim);font-size:13px;padding:10px 16px;border-radius:var(--radius-pill);cursor:pointer;}
.btn-prim:hover{filter:brightness(1.08);}
.btn-sec:hover{color:var(--text);border-color:var(--accent);}

/* detail links */
.det-links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}

/* settings */
.set-sec{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--faint);text-transform:uppercase;margin:16px 0 8px;}
.set-sec:first-child{margin-top:0;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-s);}
.set-row:last-child{border-bottom:none;}
.set-lbl{font-size:13px;color:var(--dim);flex:1;min-width:0;}
.set-lbl b{color:var(--text);display:block;font-size:12px;margin-bottom:1px;}
.set-lbl small{font-size:11px;color:var(--faint);}
.set-btns{display:flex;gap:5px;flex-shrink:0;}

.empty{text-align:center;color:var(--faint);padding:50px 20px;font-size:13px;border:1px dashed var(--border);border-radius:14px;}

/* Checklist */
.cl-wrap{background:var(--bg-el);border:1px solid var(--border-s);border-radius:9px;padding:12px;margin-bottom:12px;}
.cl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cl-title{font-size:12px;font-weight:650;color:var(--text);}
.cl-progress{font-size:11px;color:var(--dim);}
.cl-progress.all-done{color:var(--s4);font-weight:600;}
.cl-prog-bar{height:3px;border-radius:99px;background:var(--border);margin-bottom:8px;overflow:hidden;}
.cl-prog-fill{height:100%;border-radius:99px;background:var(--s4);transition:width .3s;}
.cl-item{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--border-s);}
.cl-item:last-of-type{border-bottom:none;padding-bottom:0;}
.cl-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none;}
.cl-label{flex:1;font-size:12.5px;color:var(--text);cursor:pointer;user-select:none;}
.cl-label.done{color:var(--faint);text-decoration:line-through;}
.cl-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:0 3px;line-height:1;flex:none;}
.cl-del:hover{color:var(--danger);}
.cl-add-row{display:flex;gap:7px;margin-top:9px;}
.cl-add-inp{flex:1;background:var(--bg-card);border:1px solid var(--border);color:var(--text);
  font-size:12px;padding:6px 9px;border-radius:7px;outline:none;font-family:inherit;}
.cl-add-inp:focus{border-color:var(--accent);}
.btn-cl-add{background:var(--glow);border:1px solid var(--accent);color:var(--accent2);
  font-size:12px;font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.btn-cl-add:hover{background:var(--accent);color:#140c24;}
.cl-badge{font-size:10px;color:var(--s4);background:rgba(79,214,147,.1);
  border:1px solid rgba(79,214,147,.2);border-radius:5px;padding:1px 5px;white-space:nowrap;}
.cl-badge.partial{color:var(--dim);background:var(--bg-el);border-color:var(--border);}

/* Discovery panel */
.disc-panel{background:var(--bg-card);border:1px solid var(--accent);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;box-shadow:0 0 0 1px var(--glow),var(--shadow);}
.disc-head h3{font-size:14px;font-weight:650;color:var(--accent);display:flex;align-items:center;gap:7px;}
.btn-disc-search{background:var(--accent);border:none;color:var(--btn-text);font-weight:700;
  font-size:13px;padding:10px 16px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;}
.btn-disc-add{background:var(--glow);border:1px solid var(--accent);color:var(--accent);
  font-size:12px;font-weight:650;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:background .15s;}
.btn-disc-add:hover{background:var(--accent);color:var(--btn-text);}
.btn-disc-add.added{background:var(--glow);border-color:var(--s4);color:var(--s4);cursor:default;}
.disc-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border-s);}
.disc-inputs{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border-s);}
@media(max-width:560px){.disc-inputs{grid-template-columns:1fr;}}
.disc-inp{background:var(--bg-el);border:1px solid var(--border);color:var(--text);
  font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);outline:none;font-family:inherit;}
.disc-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);}
.btn-disc-search:hover{filter:brightness(1.08);}
.btn-disc-search:disabled{opacity:.4;cursor:default;}
.disc-results{padding:0 12px;}
.disc-card{background:var(--bg-el);border:1px solid var(--border-s);border-radius:var(--radius-sm);
  padding:14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;}
.disc-card-info{flex:1;min-width:0;}
.disc-card-info h4{font-size:13px;font-weight:650;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.disc-card-info p{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:4px;}
.disc-card-info small{font-size:11px;color:var(--faint);}
.disc-card-info small span{margin-right:10px;}
.disc-footer{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.disc-status{font-size:12px;color:var(--dim);flex:1;}
.disc-status.err{color:var(--danger);}
.disc-status.ok{color:var(--s4);}
.btn-disc-more{background:var(--bg-el);border:1px solid var(--border);color:var(--dim);
  font-size:12px;padding:7px 13px;border-radius:8px;cursor:pointer;}
.btn-disc-more:hover{color:var(--text);border-color:var(--accent);}

/* theme picker */
.theme-modes{display:flex;gap:6px;}
.accent-grid{display:flex;flex-wrap:wrap;gap:8px;}
.accent-swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:transform .15s,box-shadow .15s;flex-shrink:0;}
.accent-swatch:hover{transform:scale(1.08);}
.accent-swatch.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--bg-card),0 0 0 4px var(--accent);}
.custom-accent-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.custom-accent-row input[type=color]{width:36px;height:36px;border:none;border-radius:50%;cursor:pointer;
  background:transparent;padding:0;overflow:hidden;}
.custom-accent-row span{font-size:12px;color:var(--dim);}

footer.note{text-align:center;color:var(--faint);font-size:11px;margin-top:26px;line-height:1.6;}

@media(max-width:600px){
  .app{padding:14px 12px 70px;}
  .fgrid{grid-template-columns:1fr;}
  select.ssel{max-width:none;width:100%;order:5;flex-basis:100%;}
  .card-main{gap:6px;}
  .modal{padding:16px;}
  .ob-body{padding:16px 18px 20px;}
}
@media(max-width:400px){
  .subtitle{display:none;}
  .topbar-right .lbtn{display:none;}
}
[hidden]{display:none!important;}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding">
  <div class="ob-box">
    <div class="ob-head">
      <h1>Praktikum<span style="color:var(--accent)">.</span></h1>
      <p id="obSub"></p>
    </div>
    <div class="ob-steps">
      <div class="ob-step" id="obs0"></div>
      <div class="ob-step" id="obs1"></div>
      <div class="ob-step" id="obs2"></div>
      <div class="ob-step" id="obs3"></div>
    </div>
    <div class="ob-body" id="obBody"></div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" hidden>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <h1>Praktikum<span class="dot">.</span> <span class="sync-dot" id="syncDot"></span></h1>
        <p class="subtitle" id="appSub"></p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-ghost lbtn" data-l="de">DE</button>
      <button class="btn-ghost lbtn" data-l="ru">RU</button>
      <button class="btn-ghost lbtn" data-l="en">EN</button>
      <button class="btn-ghost" id="btnSettings">⚙</button>
      <button class="btn-ghost" id="btnDiscover"></button>
      <button class="btn-ghost" id="btnPdf"></button>
      <button class="btn-ghost" id="btnArchive"></button>
      <button class="btn-ghost" id="btnExport"></button>
      <button class="btn-ghost" id="btnImport"></button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn-add" id="btnAdd"></button>
    </div>
  </div>

  <!-- Sync bar -->
  <div class="bar" id="syncBar" hidden>
    <span class="bar-dot" id="syncBarDot"></span>
    <span class="bar-text" id="syncBarText"></span>
    <button class="btn-ghost bar-btn" id="syncBarBtn" hidden></button>
  </div>

  <!-- Autosave bar -->
  <div class="bar" id="asBar">
    <span class="bar-dot" id="asDot"></span>
    <span class="bar-text" id="asText"></span>
    <button class="btn-ghost bar-btn" id="asBtn" hidden></button>
    <button class="btn-ghost bar-btn" id="asDisBtn" hidden></button>
  </div>

  <!-- RL bar -->
  <div class="bar" id="rlBar" hidden>
    <span style="font-size:13px;flex:none;">⚡</span>
    <span class="bar-text" id="rlText"></span>
  </div>

  <!-- Hero / Progress -->
  <div class="hero-card" id="heroCard">
    <div class="hero-top">
      <span class="hero-label" id="heroLbl"></span>
      <span class="hero-pct" id="pctLbl">0%</span>
    </div>
    <div class="hero-stat"><b id="sentN">0</b> <span id="sentLbl"></span></div>
    <div class="prog-wrap">
      <div class="prog-track" id="progTrack"></div>
    </div>
  </div>

  <div class="frow" id="filterRow"></div>
  <div class="frow" id="prioRow"></div>
  <div class="sort-row" id="sortRow"></div>
  <div class="search-row"><input class="search-inp" id="searchInp" type="text"></div>

  <!-- Discovery panel -->
  <div class="disc-panel" id="discPanel" hidden>
    <div class="disc-head">
      <h3>🔍 <span id="discTitle"></span></h3>
      <button class="btn-ghost" id="discCloseBtn" style="font-size:11px;">✕</button>
    </div>
    <div class="disc-inputs">
      <input class="disc-inp" id="discProf" type="text">
      <input class="disc-inp" id="discLoc" type="text">
      <button class="btn-disc-search" id="discSearchBtn"></button>
    </div>
    <div id="discResults"></div>
    <div class="disc-footer" id="discFooter" hidden>
      <span class="disc-status" id="discStatus"></span>
      <button class="btn-disc-more" id="discMoreBtn" hidden></button>
    </div>
  </div>

  <main class="list" id="cardList"></main>
  <p class="empty" id="emptyState" hidden></p>
  <footer class="note" id="footerNote"></footer>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="addModal" hidden>
  <div class="modal">
    <h2 id="addTitle"></h2>
    <div class="fgrid">
      <div class="field" style="grid-column:1/-1"><label id="lblName"></label><input type="text" id="fName"></div>
      <div class="field"><label id="lblProf"></label><input type="text" id="fProf"></div>
      <div class="field"><label id="lblPrio"></label>
        <select id="fPrio">
          <option value="" id="fPrioNone"></option>
          <option value="A">⭐ A</option>
          <option value="B">🔵 B</option>
          <option value="C">⚪ C</option>
        </select>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label id="lblAiLoc"></label>
        <input type="text" id="fAiLoc">
      </div>
    </div>
    <div class="ai-row"><button class="btn-ai" id="aiFillBtn">✨ <span id="aiFillLbl"></span></button></div>
    <p id="aiDisc" style="font-size:11px;color:var(--faint);margin:3px 0 10px;"></p>
    <div class="ai-st" id="aiStNew"></div>
    <div class="fgrid">
      <div class="field"><label id="lblSite"></label><input type="text" id="fSite"></div>
      <div class="field"><label id="lblPhone"></label><input type="text" id="fPhone"></div>
      <div class="field"><label id="lblCont"></label><input type="text" id="fCont"></div>
      <div class="field"><label id="lblRole"></label><input type="text" id="fRole"></div>
      <div class="field"><label id="lblEmail"></label><input type="text" id="fEmail"></div>
      <div class="field"><label id="lblAddr"></label><input type="text" id="fAddr"></div>
    </div>
    <div class="field"><label id="lblNotes"></label><textarea id="fNotes"></textarea></div>
    <div class="m-actions">
      <button class="btn-sec" id="addCancelBtn"></button>
      <button class="btn-prim" id="addSaveBtn"></button>
    </div>
  </div>
</div>

<!-- TOKEN REVEAL MODAL -->
<div class="overlay" id="tokenModal" hidden style="z-index:200;">
  <div class="modal" style="max-width:360px;text-align:center;">

    <!-- Step 1: Confirm screen -->
    <div id="tokenConfirmScreen">
      <div style="font-size:36px;margin-bottom:12px;">🔐</div>
      <b style="font-size:15px;color:var(--text);display:block;margin-bottom:8px;" id="tokenConfirmTitle"></b>
      <div style="background:rgba(241,102,110,.12);border:1px solid rgba(241,102,110,.3);border-radius:10px;padding:12px;margin-bottom:16px;">
        <p style="font-size:13px;color:var(--danger);font-weight:600;margin-bottom:4px;" id="tokenWarnTitle"></p>
        <p style="font-size:12px;color:var(--dim);" id="tokenWarnDesc"></p>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button class="btn-sec" id="tokenConfirmCancelBtn" style="font-size:13px;"></button>
        <button class="btn-prim" id="tokenConfirmOkBtn" style="font-size:13px;background:var(--danger);"></button>
      </div>
    </div>

    <!-- Step 2: QR + token -->
    <div id="tokenShowScreen" hidden>
      <div style="background:rgba(241,102,110,.08);border:1px solid rgba(241,102,110,.2);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--danger);" id="tokenShowWarn"></div>
      <p style="font-size:12px;font-weight:600;color:var(--dim);margin-bottom:8px;" id="tokenQrLabel"></p>
      <div style="display:flex;justify-content:center;margin-bottom:8px;">
        <div id="tokenQrCode" style="background:#161220;padding:10px;border-radius:10px;border:1px solid var(--border);"></div>
      </div>
      <p style="font-size:11px;color:var(--faint);margin-bottom:12px;" id="tokenQrHint"></p>
      <div style="background:var(--bg-el);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;font-family:monospace;font-size:11px;color:var(--dim);word-break:break-all;" id="tokenText"></div>
      <div style="font-size:12px;color:var(--s3);margin-bottom:14px;">
        <span id="tokenCountdownTxt"></span> <b id="tokenCountdown"></b>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button class="btn-sec" id="tokenCopyBtn" style="font-size:12px;"></button>
        <button class="btn-prim" id="tokenCloseBtn" style="font-size:12px;"></button>
      </div>
    </div>

  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="settingsModal" hidden>
  <div class="modal" style="max-width:450px;">
    <h2 id="setTitle"></h2>

    <p class="set-sec" id="setSecAcc"></p>

    <!-- GitHub row -->
    <div class="set-row">
      <div class="set-lbl">
        <b id="setLblGh"></b>
        <small id="setGhStatus" style="display:flex;align-items:center;gap:5px;margin-top:3px;"></small>

      </div>
    </div>
    <!-- QR token row — only shown when connected -->

      <div class="set-lbl">
        <b id="setLblQr"></b>
        <small id="setLblQrSub"></small>
      </div>
      <button class="btn-ghost bar-btn" id="setGhShowBtn" style="font-size:11px;">📲 QR</button>
    </div>

    <!-- Gemini key row -->
    <div class="set-row">
      <div class="set-lbl">
        <b id="setLblGemini"></b>
        <small id="setGeminiStatus" style="font-family:monospace;font-size:11px;color:var(--faint);margin-top:2px;display:block;"></small>
      </div>
      <button class="btn-ghost bar-btn" id="setGeminiBtn"></button>
    </div>

    <!-- Language -->
    <div class="set-row">
      <div class="set-lbl"><b id="setLblLang"></b></div>
      <div class="set-btns">
        <button class="btn-ghost lbtn bar-btn" data-l="de">DE</button>
        <button class="btn-ghost lbtn bar-btn" data-l="ru">RU</button>
        <button class="btn-ghost lbtn bar-btn" data-l="en">EN</button>
      </div>
    </div>

    <!-- Theme -->
    <p class="set-sec" id="setSecTheme"></p>
    <div class="set-row">
      <div class="set-lbl"><b id="setLblThemeMode"></b></div>
      <div class="set-btns theme-modes">
        <button class="btn-ghost bar-btn theme-mode-btn" data-mode="dark" id="themeDarkBtn"></button>
        <button class="btn-ghost bar-btn theme-mode-btn" data-mode="light" id="themeLightBtn"></button>
      </div>
    </div>
    <div class="set-row" style="flex-direction:column;align-items:stretch;">
      <div class="set-lbl" style="margin-bottom:10px;"><b id="setLblThemeAccent"></b></div>
      <div class="accent-grid" id="accentGrid"></div>
      <div class="custom-accent-row">
        <input type="color" id="themeCustomPicker" value="#00d26a">
        <span id="setLblCustomAccent"></span>
      </div>
    </div>

    <p class="set-sec" id="setSecBlueprint"></p>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
      <p style="font-size:11px;color:var(--dim);margin:0;flex:1;" id="bpDescEl"></p>
      <button class="btn-ghost" id="bpResetBtn" style="font-size:11px;flex-shrink:0;"></button>
    </div>
    <div id="bpList" style="margin-bottom:8px;"></div>
    <div class="cl-add-row" style="margin-bottom:16px;">
      <input type="text" class="cl-add-inp" id="bpInp">
      <button class="btn-cl-add" id="bpAddBtn"></button>
    </div>

    <p class="set-sec" id="setSecSync"></p>

    <!-- Sync now -->
    <div class="set-row" id="setSyncNowRow" hidden>
      <div class="set-lbl"><b id="setLblSyncNow"></b><small id="setLblSyncNowSub"></small></div>
      <button class="btn-ghost bar-btn" id="setSyncNowBtn"></button>
    </div>

    <p class="set-sec" id="setSecStore"></p>

    <!-- Autosave -->
    <div class="set-row">
      <div class="set-lbl"><b id="setLblAs"></b><small id="setLblAsSub"></small></div>
      <button class="btn-ghost bar-btn" id="setAsBtn"></button>
    </div>


    <!-- Download / share link -->
    <div class="set-row">
      <div class="set-lbl">
        <b id="setLblShare"></b>
        <small id="setShareUrl" style="font-size:11px;color:var(--faint);word-break:break-all;display:block;margin-top:2px;"></small>
      </div>
      <div class="set-btns">
        <button class="btn-ghost bar-btn" id="setShareOpenBtn" style="font-size:11px;" title="Open"></button>
        <button class="btn-ghost bar-btn" id="setShareCopyBtn" style="font-size:11px;" title="Copy"></button>
      </div>
    </div>

    <div class="m-actions"><button class="btn-prim" id="setCloseBtn"></button></div>
  </div>
</div>

function daysDiff(isoDate){
  if(!isoDate)return null;
  const d=new Date(isoDate),now=new Date();
  now.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return Math.round((d-now)/(1000*60*60*24));
}

function sentAgoBadge(c){
  if(!c.sentDate||c.status==="not_sent")return"";
  const d=daysDiff(c.sentDate);if(d===null)return"";
  const days=Math.abs(d);
  if(days===0)return`<span class="sent-ago">${t("sentToday")}</span>`;
  return`<span class="sent-ago">${t("sentAgo",{d:days})}</span>`;
}

function parseHex(hex){
  let h=(hex||"").replace("#","").trim();
  if(h.length===3)h=h.split("").map(c=>c+c).join("");
  if(h.length!==6||!/^[0-9a-fA-F]+$/.test(h))return[0,210,106];
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function toHex(r,g,b){return"#"+[r,g,b].map(x=>Math.max(0,Math.min(255,x|0)).toString(16).padStart(2,"0")).join("");}
function mixHex(hex,ratio){
  const[r,g,b]=parseHex(hex),t=ratio>0?255:0,f=Math.abs(ratio);
  return toHex(r+(t-r)*f,g+(t-g)*f,b+(t-b)*f);
}
function hexAlpha(hex,a){const[r,g,b]=parseHex(hex);return`rgba(${r},${g},${b},${a})`;}

function safeUrl(raw){
  if(!raw||typeof raw!=="string")return"";
  const s=raw.trim();if(!s)return"";
  try{
    const u=new URL(/^https?:\/\//i.test(s)?s:"https://"+s);
    if(u.protocol!=="http:"&&u.protocol!=="https:")return"";
    return u.href;
  }catch(e){return"";}
}
function safeTel(raw){
  if(!raw||typeof raw!=="string")return"";
  return raw.replace(/[^\d+\s().-]/g,"").trim().slice(0,50);
}
function safeEmail(raw){
  if(!raw||typeof raw!=="string")return"";
  const s=raw.trim().slice(0,200);
  return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)?s:"";
}
function isGeminiKey(raw){

// ── GitHub Gist Sync ──────────────────────────────────────
async function ghFetch(method,path,body){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch("https://api.github.com/"+path,{method,signal:ctrl.signal,
      headers:{"Authorization":"token "+ghPat,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body:body?JSON.stringify(body):undefined});
    if(!r.ok){const e=await r.text().catch(()=>"");throw Object.assign(new Error(e.slice(0,100)),{status:r.status});}
    return r.json();
  }catch(e){
    if(e.name==="AbortError")throw new Error("Request timed out");
    throw e;
  }finally{clearTimeout(timer);}
}

// Gist payload always includes the Gemini key so it syncs too
function buildGistPayload(){
  return{updatedAt:Date.now(),geminiKey,companies,blueprint,blueprintTs:parseInt(localStorage.getItem(SK_BP_TS)||"0")};
}

// Merges two company lists by id: for ids present in both, keeps whichever
// has the newer updatedAt; ids present only on one side are kept as-is.
// Note: this is a simple union merge with no delete-tombstones — if a
// company was deleted on one device it may reappear after syncing from
// another device that still has it. Good enough for a small personal list.
function mergeCompanies(local,remote){
  const map=new Map();
  (local||[]).forEach(c=>map.set(c.id,c));
  (remote||[]).forEach(rc=>{
    const lc=map.get(rc.id);
    if(!lc){map.set(rc.id,rc);return;}
    const lt=lc.updatedAt||0,rt=rc.updatedAt||0;
    if(rt>lt)map.set(rc.id,rc);
  });
  return Array.from(map.values());
}

let _syncLock=false;
async function pushGist(){
  if(!ghPat||!gistId)return;
  if(_syncLock)return; // already syncing, skip — saveC will be called again on next change
  _syncLock=true;
  try{
    setSyncState("spin");
    await ghFetch("PATCH","gists/"+gistId,{files:{[GF]:{content:JSON.stringify(buildGistPayload())}}});
    syncTs=Date.now();localStorage.setItem(SK_STS,syncTs);
    setSyncState("ok");renderSyncBar();
  }catch(e){setSyncState("err",e.message);}
  finally{_syncLock=false;}
}

async function pullGist(){
  if(!ghPat||!gistId)return;
  if(_syncLock)return;
  _syncLock=true;
  try{
    setSyncState("spin");
    const data=await ghFetch("GET","gists/"+gistId);
    const raw=data.files?.[GF]?.content;if(!raw)throw new Error("no file");
    const p=JSON.parse(raw);
    // Always update Gemini key from gist (keeps keys in sync across devices)
    if(p.geminiKey&&p.geminiKey!==geminiKey){geminiKey=p.geminiKey;localStorage.setItem(SK_GEMINI,geminiKey);}
    // Sync blueprint — newer timestamp wins
    if(p.blueprint&&Array.isArray(p.blueprint)){
      const localTs=parseInt(localStorage.getItem(SK_BP_TS)||"0");
      const remoteTs=p.blueprintTs||0;
      if(remoteTs>localTs){
        blueprint=p.blueprint;
        localStorage.setItem(SK_BP,JSON.stringify(blueprint));
        localStorage.setItem(SK_BP_TS,String(remoteTs));
      }
    }
    const remoteCompanies=p.companies||[];
    const merged=mergeCompanies(companies,remoteCompanies);
    const changed=JSON.stringify(merged)!==JSON.stringify(companies);
    companies=merged;
    localStorage.setItem(SK,JSON.stringify(companies));
    render();
    if(changed){
      // Push the merged result back so the other device also gets our local-only changes
      await ghFetch("PATCH","gists/"+gistId,{files:{[GF]:{content:JSON.stringify(buildGistPayload())}}});
    }
    syncTs=Date.now();localStorage.setItem(SK_STS,syncTs);
    setSyncState("ok");renderSyncBar();
  }catch(e){setSyncState("err",e.message);}
  finally{_syncLock=false;}
}

// Returns {geminiKey} from existing gist or null
async function findExistingGist(pat){
  const tmp=ghPat;ghPat=pat;
  try{
    const gists=await ghFetch("GET","gists");
    const found=gists.find(g=>g.files&&g.files[GF]);
    if(!found){ghPat=tmp;return null;}
    gistId=found.id;localStorage.setItem(SK_GIST,gistId);
    const full=await ghFetch("GET","gists/"+gistId);
    const raw=full.files?.[GF]?.content;
    const p=raw?JSON.parse(raw):{};
    return{geminiKey:p.geminiKey||"",companies:p.companies||[]};
  }catch(e){ghPat=tmp;throw e;}
}

async function connectGist(pat){
  ghPat=pat;localStorage.setItem(SK_PAT,ghPat);
  setSyncState("spin");
  try{
    const found=await findExistingGist(pat);
    if(found){
      if(found.geminiKey){geminiKey=found.geminiKey;localStorage.setItem(SK_GEMINI,geminiKey);}
      companies=mergeCompanies(companies,found.companies||[]);
      localStorage.setItem(SK,JSON.stringify(companies));
      syncTs=Date.now();localStorage.setItem(SK_STS,syncTs);
      // Push merged result back so both sides converge
      await ghFetch("PATCH","gists/"+gistId,{files:{[GF]:{content:JSON.stringify(buildGistPayload())}}});
    }else{
      // Create new gist with current data
      const created=await ghFetch("POST","gists",{description:"Praktikum Tracker Sync",public:false,files:{[GF]:{content:JSON.stringify(buildGistPayload())}}});
      gistId=created.id;localStorage.setItem(SK_GIST,gistId);
      syncTs=Date.now();localStorage.setItem(SK_STS,syncTs);
    }
    setSyncState("ok");renderSyncBar();renderSettings();
    return{geminiKey};
  }catch(e){
    setSyncState("err",e.status===401?t("syncEPat"):e.message);
    ghPat="";gistId="";localStorage.removeItem(SK_PAT);localStorage.removeItem(SK_GIST);
    throw e;
  }
}

function disconnectGist(){
  ghPat="";gistId="";syncTs=0;
  localStorage.removeItem(SK_PAT);localStorage.removeItem(SK_GIST);localStorage.removeItem(SK_STS);
  setSyncState("none");renderSyncBar();renderSettings();
}

function geminiKeyMeta(){

function geminiLog(event,details={}){
  const entry={time:new Date().toISOString(),event,...details};
  console.info("[Gemini]",entry);
  try{
    const logs=JSON.parse(localStorage.getItem("prak_gemini_log")||"[]");
    logs.push(entry);
    localStorage.setItem("prak_gemini_log",JSON.stringify(logs.slice(-30)));

}
function bPrompt(name,prof,loc){
  const p=prof?` The student seeks a "${prof}" internship/Ferialpraktikum.`:"";
  const l=loc?` Location: "${loc}".`:"";
  return{
    sys:`You are a contact research assistant for an HTL student looking for a Ferialpraktikum (internship). Find: website, phone, HR/internship email, contact person name+role, office address.${p}${l} Reply ONLY valid JSON no markdown: {"website":"","phone":"","email":"","contactName":"","contactRole":"","address":"","notes":""}. Empty string if unknown. Never invent data.`,
    usr:`Company: "${name}".${loc?` Location: "${loc}".`:""}${prof?` Seeking "${prof}" internship contact.`:""}`
  };
}
function geminiJson(data){
  const raw=data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("bad json");
  return JSON.parse(m[0]);
}
async function callGemini(name,prof,loc){
  const{sys,usr}=bPrompt(name,prof,loc);
  geminiLog("request",{phase:"contact",model:"gemini-2.5-flash",endpoint:"generateContent",key:geminiKeyMeta(),googleSearch:true,systemChars:sys.length,userChars:usr.length});
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),30000);
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{
      method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json","x-goog-api-key":geminiKey},
      body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:usr}]}],tools:[{google_search:{}}],generationConfig:{temperature:.1,maxOutputTokens:280}})});
    geminiLog("response",{phase:"contact",status:r.status,ok:r.ok,contentType:r.headers.get("content-type")||""});
    try{updRl(r.headers);}catch(e){}
    if(!r.ok){
      const e=await r.text().catch(()=>"");
      geminiLog("error",{phase:"contact",status:r.status,apiError:apiErrorDetail(e),response:e.slice(0,500)});
      throw Object.assign(new Error(e.slice(0,500)),{status:r.status});
    }
    return geminiJson(await r.json());
  }catch(e){
    if(e.name==="AbortError")throw new Error(t("aiENet")+" (timeout)");
    throw e;
  }finally{clearTimeout(timer);}
}
function apiErrorDetail(message){
  try{
    const data=JSON.parse(message);
    return data.error?.status||data.error?.message||"";
  }catch(_){return "";}
}
function aiErr(e){
  const s=e.status,m=e.message||"";
  if(s===429||m.includes("429"))return t("aiE429",{r:utc(rlCache.resetAt)});
  if(s===401){const d=apiErrorDetail(m);return t("aiEKey")+(d?" "+d:"");}
  if(s===403){const d=apiErrorDetail(m);return t("aiEAccess")+(d?" "+d:"");}
  if(m.includes("Failed to fetch")||m.includes("NetworkError"))return t("aiENet");
  return t("aiEGen",{m:m.slice(0,60)});
}
async function aiFill(name,prof,loc){
  return{r:await callGemini(name,prof,loc),s:true};
}
async function runAi(stEl,btn,name,prof,loc,apFn){
  if(!name.trim()){stEl.className="ai-st err";stEl.textContent="—";return;}
  btn.disabled=true;stEl.className="ai-st loading";stEl.textContent=t("aiLoad");
  try{const{r,s}=await aiFill(name.trim(),prof,loc||"");apFn(r);stEl.className="ai-st ok";stEl.textContent=s?t("aiOk"):t("aiOkN");}
  catch(e){stEl.className="ai-st err";stEl.textContent=aiErr(e);renderRl();}

}

function parseDate(v){
  if(!v)return"";v=v.trim();if(!v)return"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  const eu=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(v);
  if(eu)return`${eu[3]}-${eu[2].padStart(2,"0")}-${eu[1].padStart(2,"0")}`;

const PO={"A":0,"B":1,"C":2,"":3};
function getFiltered(){
  return companies.filter(c=>{
    if(viewArchive){ if(!c.archived)return false; }
    else{ if(c.archived)return false; }
    if(!viewArchive&&activeFilter!=="all"&&c.status!==activeFilter)return false;
    if(searchTerm&&!c.name.toLowerCase().includes(searchTerm.toLowerCase()))return false;
    if(!viewArchive&&activePrios.size>0){
      const ok=(activePrios.has("A")&&c.priority==="A")||(activePrios.has("B")&&c.priority==="B")||(activePrios.has("C")&&c.priority==="C")||(activePrios.has("none")&&!c.priority)||(activePrios.has("nopos")&&c.noPosition);
      if(!ok)return false;
    }
    return true;
  }).sort((a,b)=>{
    if(sortMode==="sent"){const da=a.sentDate?new Date(a.sentDate):new Date(9999,0),db=b.sentDate?new Date(b.sentDate):new Date(9999,0);return da-db;}
    if(sortMode==="name")return a.name.localeCompare(b.name);
    return(PO[a.priority||""]??3)-(PO[b.priority||""]??3);
  });
}

function renderList(){
  const list=document.getElementById("cardList"),empty=document.getElementById("emptyState");
  const f=getFiltered();
  if(viewArchive){
    if(!f.length){list.innerHTML="";empty.hidden=false;empty.textContent=t("archiveEmpty");return;}
    empty.hidden=true;list.innerHTML=f.map(cardHtml).join("");
    return;
  }
  const activeCount=companies.filter(c=>!c.archived).length;
  if(!activeCount){list.innerHTML="";empty.hidden=false;empty.textContent=t("eList");return;}
  if(!f.length){list.innerHTML="";empty.hidden=false;empty.textContent=t("eFilter");return;}
  empty.hidden=true;list.innerHTML=f.map(cardHtml).join("");
}

function defaultChecklist(){
  const src=(blueprint&&blueprint.length)?blueprint:(I18N[lang].clDefaults||I18N.de.clDefaults);
  return src.map((label,i)=>({id:"bp"+i+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),label,done:false}));
}
function ensureChecklist(c){
  if(!c.checklist)c.checklist=[];
}
function addC(d){companies.unshift({id:uid(),name:d.name,status:"not_sent",sentDate:"",
  profession:d.profession||"",priority:d.priority||"",noPosition:false,
  archived:false,updatedAt:Date.now(),
  checklist:defaultChecklist(),
  openDate:"",deadline:"",datesFromAi:false,datesConfirmed:false,
  website:d.website||"",phone:d.phone||"",contactName:d.contactName||"",
  contactRole:d.contactRole||"",email:d.email||"",address:d.address||"",notes:d.notes||""});saveC();render();}
function delC(id){if(!confirm(t("delQ")))return;companies=companies.filter(c=>c.id!==id);if(expandedId===id)expandedId=null;saveC();render();}
function setSt(id,status){const c=companies.find(c=>c.id===id);if(!c)return;c.status=status;c.updatedAt=Date.now();if(status!=="not_sent"&&!c.sentDate)c.sentDate=today();saveC();render();}
function archiveC(id){const c=companies.find(c=>c.id===id);if(!c)return;c.archived=true;c.updatedAt=Date.now();if(expandedId===id)expandedId=null;saveC();render();}
function unarchiveC(id){const c=companies.find(c=>c.id===id);if(!c)return;c.archived=false;c.updatedAt=Date.now();saveC();render();}
function saveDet(id,card){
  const c=companies.find(c=>c.id===id);if(!c)return;
  const oldOpen=c.openDate,oldDl=c.deadline;
  card.querySelectorAll("[data-f]").forEach(el=>{
    if(el.type==="checkbox")c[el.dataset.f]=el.checked;
    else if(el.dataset.dtype==="date")c[el.dataset.f]=parseDate(el.value);
    else c[el.dataset.f]=el.value.trim();
  });
  if((c.openDate!==oldOpen||c.deadline!==oldDl)&&c.datesFromAi){
    c.datesConfirmed=true;
  }
  c.updatedAt=Date.now();
  saveC();render();
}

// ── Onboarding ────────────────────────────────────────────
let obStep=0,obLang=lang;

async function renderOb(){
  const L=I18N[obLang]||I18N.de;document.getElementById("obSub").textContent=ob("sub");
  [0,1,2,3].forEach(i=>document.getElementById("obs"+i).className="ob-step"+(i<=obStep?" done":""));
  const body=document.getElementById("obBody");

  if(obStep===0){
    body.innerHTML=`<h2>${ob("t0")}</h2>
    <div class="lang-grid">${["de","ru","en"].map(l=>`<div class="lang-opt${obLang===l?" sel":""}" data-ol="${l}"><span class="flag">${l==="de"?"🇦🇹":l==="ru"?"🇷🇺":"🇬🇧"}</span><span class="lname">${l==="de"?"Deutsch":l==="ru"?"Русский":"English"}</span></div>`).join("")}</div>
    <div class="ob-footer"><button class="btn-next" id="obNext">${ob("next")}</button></div>`;
    body.querySelectorAll("[data-ol]").forEach(el=>el.addEventListener("click",()=>{obLang=el.dataset.ol;renderOb();}));
    document.getElementById("obNext").addEventListener("click",()=>{obStep=1;renderOb();});
  }
  else if(obStep===1){
    // GitHub step (optional)
    const i1=(I18N[obLang]||I18N.de).ob.i1||[];
    body.innerHTML=`<h2>${ob("t1")} <span class="ob-opt-badge">optional</span></h2>
    <div class="ob-instr"><ol>${i1.map(s=>`<li>${s}</li>`).join("")}</ol></div>
    <div class="ob-field"><input type="password" id="obPat" placeholder="${ob("p1")}" autocomplete="off"><button type="button" class="btn-back" id="obPatToggle" style="flex:none;padding:9px 12px;">👁</button></div>
    <div class="ob-err" id="obPatErr"></div>
    <div class="ob-info" id="obPatInfo"></div>
    <p class="ob-skip" id="obSkip">${ob("skip1")}</p>
    <div class="ob-footer">
      <button class="btn-back" id="obBack">${ob("back")}</button>
      <button class="btn-next" id="obNext">${ob("next")}</button>
    </div>`;
    document.getElementById("obBack").addEventListener("click",()=>{obStep=0;renderOb();});
    document.getElementById("obSkip").addEventListener("click",()=>{obStep=2;renderOb();});
    document.getElementById("obPatToggle").addEventListener("click",()=>{
      const inp=document.getElementById("obPat");
      const isHidden=inp.type==="password";
      inp.type=isHidden?"text":"password";
      document.getElementById("obPatToggle").textContent=isHidden?"🙈":"👁";
    });
    document.getElementById("obNext").addEventListener("click",async()=>{
      const v=document.getElementById("obPat").value.trim();
      if(!v){obStep=2;renderOb();return;}
      const errEl=document.getElementById("obPatErr"),infoEl=document.getElementById("obPatInfo");
      const btn=document.getElementById("obNext");btn.disabled=true;
      infoEl.textContent=t("syncing");
      try{
        const result=await connectGist(v);
        lang=obLang;localStorage.setItem(SK_LANG,lang);
        // If the gist had a Gemini key, skip step 2
        if(result&&result.geminiKey&&geminiKey){obStep=3;}else{obStep=2;}
        renderOb();
      }catch(e){errEl.textContent=e.message||t("syncEPat");btn.disabled=false;infoEl.textContent="";}
    });
  }
  else if(obStep===2){
    // Gemini key step
    const i2=(I18N[obLang]||I18N.de).ob.i2||[];
    const autoLoaded=geminiKey&&ghPat;
    body.innerHTML=`<h2>${ob("t2")}</h2>
    ${autoLoaded?`<div class="ob-success"><b>${ob("autoLoaded")}</b>${geminiKey.slice(0,8)}…</div>`:`<div class="ob-instr"><ol>${i2.map(s=>`<li>${s}</li>`).join("")}</ol></div>`}
    ${!autoLoaded?`<div class="ob-field"><input type="password" id="obKey" placeholder="${ob("p2")}" autocomplete="off"><button type="button" class="btn-back" id="obKeyToggle" style="flex:none;padding:9px 12px;">👁</button></div><div class="ob-err" id="obKeyErr"></div>`:""}
    <div class="ob-footer">
      <button class="btn-back" id="obBack">${ob("back")}</button>
      <button class="btn-next" id="obNext">${ob("next")}</button>
    </div>`;
    document.getElementById("obBack").addEventListener("click",()=>{obStep=1;renderOb();});
    if(!autoLoaded){
      const inp=document.getElementById("obKey"),nxt=document.getElementById("obNext");
      nxt.disabled=true;
      document.getElementById("obKeyToggle").addEventListener("click",()=>{
        const isHidden=inp.type==="password";
        inp.type=isHidden?"text":"password";
        document.getElementById("obKeyToggle").textContent=isHidden?"🙈":"👁";
      });
      inp.addEventListener("input",()=>{nxt.disabled=!isGeminiKey(inp.value.trim());document.getElementById("obKeyErr").textContent="";});

// ── Sound ─────────────────────────────────────────────────
function playChime(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[523,.0,.12],[659,.13,.5],[784,.26,.7]].forEach(([freq,start,end])=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type="sine";osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,ctx.currentTime+start);
      gain.gain.linearRampToValueAtTime(.08,ctx.currentTime+start+.04);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+end);
      osc.start(ctx.currentTime+start);osc.stop(ctx.currentTime+end);
    });
  }catch(e){}
}

// ── AI date finder ────────────────────────────────────────
async function findDatesAi(name, prof){
  const now=new Date();
  const nowStr=now.toISOString().slice(0,10);
  const year=now.getFullYear();
  const nextYear=year+1;
  const sys=`You are a research assistant. Find Austrian company Ferialpraktikum/internship application window dates.
Today is ${nowStr}. You MUST return only FUTURE or current dates (${nowStr} or later).
If a company has annual deadlines and the ${year} deadline has already passed, return the ${nextYear} date instead.
Return ONLY valid JSON no markdown: {"openDate":"YYYY-MM-DD","deadline":"YYYY-MM-DD","notes":"","confidence":"high|medium|low"}
Use empty string if genuinely not found or unknown. Never invent dates — if unsure use empty string.`;
  const usr=`Company: "${name}", Austria.${prof?` Profession: "${prof}".`:""} Find UPCOMING (future) dates: when applications OPEN (Bewerbungsstart) and the DEADLINE (Bewerbungsschluss/Einsendeschluss) for Ferialpraktikum/internship. Today: ${nowStr}.`;
  geminiLog("request",{phase:"dates",model:"gemini-2.5-flash",endpoint:"generateContent",key:geminiKeyMeta(),googleSearch:true,systemChars:sys.length,userChars:usr.length});
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":geminiKey},
    body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:usr}]}],tools:[{google_search:{}}],generationConfig:{temperature:.1,maxOutputTokens:200}})
  });
  geminiLog("response",{phase:"dates",status:res.status,ok:res.ok,contentType:res.headers.get("content-type")||""});
  try{updRl(res.headers);}catch(e){}
  if(!res.ok){
    const e=await res.text().catch(()=>"");
    geminiLog("error",{phase:"dates",status:res.status,apiError:apiErrorDetail(e),response:e.slice(0,500)});
    throw Object.assign(new Error(e.slice(0,500)),{status:res.status});
  }
  const result=geminiJson(await res.json());
  // Post-process: if date is in the past, try shifting it one year forward
  function shiftIfPast(iso){
    if(!iso)return iso;
    const diff=daysDiff(iso);
    if(diff!==null&&diff<0){
      const shifted=new Date(iso);
      shifted.setFullYear(shifted.getFullYear()+1);
      return shifted.toISOString().slice(0,10);
    }
    return iso;
  }
  result.openDate=shiftIfPast(result.openDate);
  result.deadline=shiftIfPast(result.deadline);
  return result;
}

- Use web search to find REAL companies with actual internship programs
- Return ONLY valid JSON array, no markdown, no explanation:
[{"name":"","description":"one sentence","address":"city, country","website":""}]
- Never invent companies. Never return excluded companies.`,
    usr:`Find companies in "${loc}" offering "${prof}" internships/Ferialpraktikum.
Must be IN: ${loc}
Exclude (already have): [${excList}]
${variety}
Search the web for real companies in ${loc}.`
  };
}

// Validates that a result's address plausibly matches the requested location.
// Loose word-overlap check — not exact geocoding, but catches obvious mismatches
// (e.g. asking for "Zürich" and getting a company address in "Wien").
function locationMatches(address, loc){
  if(!loc||!loc.trim())return true; // no location constraint given
  if(!address||!address.trim())return false; // no address to verify against — reject
  const locWords=loc.toLowerCase().split(/[\s,]+/).filter(w=>w.length>2);
  const addrLower=address.toLowerCase();
  if(!locWords.length)return true;
  return locWords.some(w=>addrLower.includes(w));
}

async function callGeminiDisc(prof,loc,page){
  const exclude=companies.map(c=>c.name);
  const{sys,usr}=buildDiscPrompt(prof,loc,exclude,page);
  geminiLog("request",{phase:"discovery",model:"gemini-2.5-flash",endpoint:"generateContent",key:geminiKeyMeta(),googleSearch:true,systemChars:sys.length,userChars:usr.length});
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),45000);
  let res;
  try{
    res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{
      method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json","x-goog-api-key":geminiKey},
      body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:usr}]}],tools:[{google_search:{}}],generationConfig:{temperature:.3,maxOutputTokens:700}})
    });
    geminiLog("response",{phase:"discovery",status:res.status,ok:res.ok,contentType:res.headers.get("content-type")||""});
  }catch(e){
    if(e.name==="AbortError")throw new Error(t("discErrNet")+" (timeout)");
    throw e;
  }finally{clearTimeout(timer);}
  try{updRl(res.headers);}catch(e){}
  if(!res.ok){
    const e=await res.text().catch(()=>"");
    geminiLog("error",{phase:"discovery",status:res.status,apiError:apiErrorDetail(e),response:e.slice(0,500)});
    throw Object.assign(new Error(e.slice(0,500)),{status:res.status});
  }
  const raw=await res.json();
  const text=raw.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
  const m=text.match(/\[[\s\S]*\]/);
  if(!m)throw new Error("bad json");
  const arr=JSON.parse(m[0]);
  if(!Array.isArray(arr))throw new Error("not array");
  // Filter out already in list AND results whose address doesn't match the requested location
  const existing=new Set(companies.map(c=>c.name.toLowerCase().trim()));
  return arr.filter(r=>r.name&&!existing.has(r.name.toLowerCase().trim())&&locationMatches(r.address,loc));
}

function discErrMsg(e){
  if(e.status===401){const d=apiErrorDetail(e.message||"");return t("discErrKey")+(d?" "+d:"");}
  if(e.status===403){const d=apiErrorDetail(e.message||"");return t("discErrAccess")+(d?" "+d:"");}
  if(e.status===429||e.message?.includes("429")||e.message?.includes("Rate limit")||e.message?.includes("rate_limit")){
    const reset=utcStr(rlCache.resetAt);
    return t("aiE429",{r:reset})+" "+{"de":"«Ещё» wird nach dem Reset wieder funktionieren.","ru":"Кнопка «Ещё» снова заработает после сброса.","en":"The «More» button will work again after reset."}[lang];
  }
  if(e.message?.includes("Failed to fetch")||e.message?.includes("NetworkError"))return t("discErrNet");
  return t("discErrGen",{m:(e.message||"").slice(0,60)});
}

function renderDiscCard(r,idx){
  const alreadyAdded=companies.some(c=>c.name.toLowerCase().trim()===r.name.toLowerCase().trim());
  const removeLabel={"de":"Entfernen","ru":"Удалить","en":"Remove"}[lang]||"Remove";
  return`<div class="disc-card" id="dcard-${idx}">
    <div class="disc-card-info">
      <h4>${esc(r.name)}</h4>
      <p>${esc(r.description)}</p>
      <small>
        ${r.address?`<span>📍 ${esc(r.address)}</span>`:""}
        ${r.website?`<span>🌐 ${esc(r.website)}</span>`:""}
      </small>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0;">
      ${alreadyAdded
        ?`<span class="btn-disc-add added" style="cursor:default;">${t("discAdded")}</span>
           <button class="btn-ghost" data-disc-remove="${idx}" style="font-size:11px;padding:5px 8px;color:var(--danger);border-color:var(--danger);">🗑 ${removeLabel}</button>`
        :`<button class="btn-disc-add" data-disc="${idx}">${t("discAdd")}</button>`
      }
    </div>
  </div>`;
}

function renderDiscResults(){
  const wrap=document.getElementById("discResults");
  if(!discAllResults.length){wrap.innerHTML="";return;}
  wrap.innerHTML=discAllResults.map((r,i)=>renderDiscCard(r,i)).join("");
}

async function runDiscovery(loadMore=false){
  const profEl=document.getElementById("discProf"),locEl=document.getElementById("discLoc");
  const prof=profEl.value.trim(),loc=locEl.value.trim();
  if(!prof||!loc){
    document.getElementById("discStatus").className="disc-status err";
    document.getElementById("discStatus").textContent={"de":"Bitte Beruf und Ort angeben.","ru":"Укажи профессию и место.","en":"Please enter profession and location."}[lang]||"Enter profession and location.";
    document.getElementById("discFooter").hidden=false;
    return;
  }
  if(!loadMore){discPage=0;discAllResults=[];discProf=prof;discLoc=loc;}
  const btn=document.getElementById("discSearchBtn"),moreBtn=document.getElementById("discMoreBtn");
  btn.disabled=true;if(moreBtn)moreBtn.disabled=true;
  const statusEl=document.getElementById("discStatus");
  statusEl.className="disc-status";statusEl.textContent=t("discLoading");
  document.getElementById("discFooter").hidden=false;
  moreBtn.hidden=true;
  try{
    const results=await callGeminiDisc(discProf,discLoc,discPage);
    if(!results.length&&!discAllResults.length){
      statusEl.className="disc-status";statusEl.textContent=t("discEmpty");
    }else{
      discAllResults=[...discAllResults,...results];
      discPage++;
      renderDiscResults();
      statusEl.className="disc-status ok";
      statusEl.textContent=t("discFound",{n:discAllResults.length});
      moreBtn.hidden=false;moreBtn.textContent=t("discMore");
    }
  }catch(e){
    statusEl.className="disc-status err";statusEl.textContent=discErrMsg(e);
    // Keep the "More" button if we already loaded some results — user can retry later
    if(discAllResults.length>0){
      moreBtn.hidden=false;moreBtn.textContent=t("discMore");
    }
  }finally{
    btn.disabled=false;if(moreBtn)moreBtn.disabled=false;
  }
}

// ── PDF Export ────────────────────────────────────────────
const STATUS_COLORS_HEX={
  not_sent:"#5b5470",sent:"#6c93ff",response:"#34c9c0",
  interview:"#f5b94e",accepted:"#4fd693",rejected:"#f1666e"
};

async function loadScript(src, integrity){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement("script");
    s.src=src;
    if(integrity){s.integrity=integrity;s.crossOrigin="anonymous";}
    s.onload=res;
    s.onerror=()=>rej(new Error("Failed to load: "+src));
    document.head.appendChild(s);
  });
}

// Known SRI hashes for CDN scripts (verified sha512)
const CDN_SRI={
  qrcode:"sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==",
  // jsPDF and AutoTable: generate at https://www.srihash.org/ and paste below
  jspdf:"",
  autotable:"",
};

async function generatePDF(){
  const btn=document.getElementById("btnPdf");
  const orig=btn.textContent;
  btn.textContent=t("pdfGenerating");btn.disabled=true;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", CDN_SRI.jspdf||undefined);
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js", CDN_SRI.autotable||undefined);
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    const W=doc.internal.pageSize.getWidth();
    const sl=I18N[lang].st;
    const dateStr=new Date().toLocaleDateString("de-AT");

    // Header background
    doc.setFillColor(13,10,20);doc.rect(0,0,W,297,"F");
    doc.setFillColor(22,18,32);doc.rect(0,0,W,28,"F");

    // Title
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(157,111,255);
    doc.text(t("pdfTitle"),14,12);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(154,144,179);
    doc.text(t("pdfSubtitle",{date:dateStr}),14,19);

    // Stats
    const sent=companies.filter(c=>c.status!=="not_sent").length;
    const accepted=companies.filter(c=>c.status==="accepted").length;
    const statsText=t("pdfTotal",{n:companies.length,s:sent,a:accepted});
    doc.setFontSize(8);doc.setTextColor(154,144,179);
    doc.text(statsText,W-14,19,{align:"right"});

    // Table data
    const rows=companies.map((c,i)=>{
      ensureChecklist(c);
      const clDone=c.checklist.filter(x=>x.done).length;
      const contact=[c.contactName,c.email||c.phone].filter(Boolean).join("\n");
      return[
        String(i+1),
        c.name+(c.noPosition?" ✗":""),
        c.profession||"—",
        c.priority||"—",
        sl[STATUSES.indexOf(c.status)]||sl[0],
        c.sentDate?fDate(c.sentDate):"—",
        contact||"—",
        `${clDone}/${c.checklist.length}`,
        (c.notes||"").slice(0,60)+(c.notes?.length>60?"…":""),
      ];
    });

    doc.autoTable({
      head:[[t("pdfColNr"),t("pdfColFirma"),t("pdfColBeruf"),t("pdfColPrio"),t("pdfColStatus"),t("pdfColGesendet"),t("pdfColKontakt"),t("pdfColAufgaben"),t("pdfColNotizen")]],
      body:rows,
      startY:32,
      styles:{
        fontSize:8,cellPadding:2.5,
        textColor:[236,231,247],fillColor:[22,18,32],
        lineColor:[42,36,56],lineWidth:.3,
        font:"helvetica",
      },
      headStyles:{
        fillColor:[33,28,48],textColor:[157,111,255],
        fontStyle:"bold",fontSize:7.5,
      },
      alternateRowStyles:{fillColor:[27,22,38]},
      columnStyles:{
        0:{cellWidth:8,halign:"center"},
        1:{cellWidth:45,fontStyle:"bold"},
        2:{cellWidth:30},
        3:{cellWidth:10,halign:"center"},
        4:{cellWidth:26},
        5:{cellWidth:20},
        6:{cellWidth:38},
        7:{cellWidth:14,halign:"center"},
        8:{cellWidth:"auto"},
      },
      didParseCell:(data)=>{
        if(data.section==="body"&&data.column.index===4){
          const status=companies[data.row.index]?.status;
          const hex=STATUS_COLORS_HEX[status]||"#5b5470";
          const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
          data.cell.styles.textColor=[r,g,b];
          data.cell.styles.fontStyle="bold";
        }
        if(data.section==="body"&&data.column.index===3&&data.cell.raw!=="—"){
          const pColors={A:[245,185,78],B:[108,147,255],C:[94,85,112]};
          data.cell.styles.textColor=pColors[data.cell.raw]||[94,85,112];
          data.cell.styles.fontStyle="bold";
        }
      },
      margin:{left:14,right:14},
      theme:"grid",
    });

    // Page numbers
    const pages=doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setFontSize(7);doc.setTextColor(94,85,112);
      doc.text(`${i} / ${pages}`,W/2,doc.internal.pageSize.getHeight()-5,{align:"center"});
    }

    const filename=`praktikum-${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(filename);
  }catch(err){
    alert("PDF error: "+err.message);
  }finally{
    btn.textContent=orig;btn.disabled=false;
  }
}
function generateIcon(size){
  const c=document.createElement("canvas");c.width=c.height=size;
  const x=c.getContext("2d"),r=size*.22;
  // Rounded background
  x.beginPath();
  if(x.roundRect)x.roundRect(0,0,size,size,r);
  else{x.moveTo(r,0);x.lineTo(size-r,0);x.quadraticCurveTo(size,0,size,r);x.lineTo(size,size-r);x.quadraticCurveTo(size,size,size-r,size);x.lineTo(r,size);x.quadraticCurveTo(0,size,0,size-r);x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);x.closePath();}
  const g=x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,getAccentHex());g.addColorStop(1,mixHex(getAccentHex(),-.45));
  x.fillStyle=g;x.fill();
  // Letter P
  x.fillStyle=themeMode==="dark"?"#ffffff":"#111111";
  x.font=`bold ${size*.48}px -apple-system,BlinkMacSystemFont,sans-serif`;
  x.textAlign="center";x.textBaseline="middle";
  x.fillText("P",size*.44,size*.5);
  // Accent dot
  x.fillStyle=mixHex(getAccentHex(),.35);
  x.font=`bold ${size*.48}px sans-serif`;
  x.fillText(".",size*.72,size*.48);
  return c.toDataURL("image/png");
}

function initPWA(){
  try{
    const icon192=generateIcon(192),icon512=generateIcon(512);
    // Favicon
    const fav=document.createElement("link");fav.rel="icon";fav.type="image/png";fav.href=generateIcon(32);document.head.appendChild(fav);
    // Apple touch icon
    const apl=document.createElement("link");apl.rel="apple-touch-icon";apl.href=generateIcon(180);document.head.appendChild(apl);
    // Web App Manifest as blob
    const manifest={name:"Praktikum Tracker",short_name:"Praktikum",
      description:"HTL Donaustadt Ferialpraktikum Tracker",
      start_url:"./",display:"standalone",
      background_color:themeMode==="dark"?"#000000":"#f2f2f7",theme_color:getAccentHex(),
      icons:[{src:icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    const mlink=document.createElement("link");mlink.rel="manifest";mlink.href=URL.createObjectURL(blob);document.head.appendChild(mlink);
  }catch(e){console.warn("PWA init failed:",e);}
}
